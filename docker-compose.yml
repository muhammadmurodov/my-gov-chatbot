# Open WebUI as the chat frontend for the my.gov.uz RAG API.
#
# The RAG API runs on the HOST (it needs the GPU, the models, and Postgres). Bind it to
# 0.0.0.0, NOT the default 127.0.0.1, or this container can't reach it via
# host.docker.internal:
#   uvicorn api:app --app-dir notebooks --host 0.0.0.0 --port 8000
#
# This container only serves the chat UI and forwards requests to that host API
# via the OpenAI-compatible endpoints it exposes (/v1/models, /v1/chat/completions).
#
#   docker compose up -d      # then open http://localhost:3000
#
# On the first visit Open WebUI asks you to create a local admin account; the
# "mygov-rag" model then appears in the model picker automatically.
services:
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: mygov-webui
    ports:
      - "3000:8080"
    extra_hosts:
      # lets the container reach the API running on the host (needed on Linux)
      - "host.docker.internal:host-gateway"
    environment:
      # point Open WebUI's OpenAI connection at the host RAG API
      - OPENAI_API_BASE_URL=http://host.docker.internal:8000/v1
      # the API ignores the key, but Open WebUI requires a non-empty value
      - OPENAI_API_KEY=sk-mygov-local
      # this is a single-model RAG backend, not a general chat client
      - ENABLE_OLLAMA_API=false
    volumes:
      # persists accounts, chat history, and settings across restarts
      - open-webui:/app/backend/data
    restart: unless-stopped

volumes:
  open-webui:
